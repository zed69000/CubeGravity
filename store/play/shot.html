<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Capture Google Play (1080 x 1920) : une légende, puis l'écran du téléphone (raw/*.png, 1080 x 2340)
     sans la barre d'état ni la barre de navigation. Rendu : node tools/store/render.mjs -->
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1230;--c1:#f6ff3d;--c2:#19e3ff;--pink:#ff4f8b;--grad:linear-gradient(90deg,#f6ff3d,#19e3ff)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--navy);font-family:Rubik,Arial,sans-serif}
.bg{position:absolute;inset:0;background:radial-gradient(circle 520px at 85% 8%,rgba(176,108,255,.35),transparent 70%),radial-gradient(circle 480px at 5% 70%,rgba(25,227,255,.16),transparent 70%),var(--navy)}
.head{position:absolute;left:76px;right:76px;top:0;height:400px;display:flex;flex-direction:column;justify-content:center;gap:18px}
h1{margin:0;font:900 74px/1.02 Rubik,Arial,sans-serif;text-transform:uppercase;letter-spacing:-.01em;color:#eaf0ff}
h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(25,227,255,.45))}
p{margin:0;font:500 36px/1.3 Rubik,Arial,sans-serif;color:#9fb0e6}
.phone{position:absolute;left:50%;top:410px;width:752px;height:1448px;transform:translateX(-50%);border-radius:58px;overflow:hidden;
  box-shadow:0 0 0 10px #1c2560,0 0 0 13px #2b3a8c,0 30px 80px rgba(0,0,0,.55),0 0 90px rgba(25,227,255,.22)}
/* la capture fait 1080 x 2340 : on retire la barre d'état (110 px) et la barre de navigation (150 px) */
.phone img{position:absolute;left:0;top:calc(-110px * 752 / 1080);width:752px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="head"><h1 id="t"></h1><p id="s"></p></div>
<div class="phone"><img id="i" alt=""></div>
<script>
const CAPTIONS={
  "1-jeu.png":["Fais <span>tourner</span> le monde","Ton perso tombe jusqu'au premier mur. Trouve le chemin vers l'autre."],
  "2-victoire.png":["Chaque <span>rendez-vous</span> compte","Plus tu gagnes de cœurs, plus la relation avance."],
  "3-souvenirs.png":["Garde les <span>souvenirs</span>","Six par rencontre, et une phrase secrète tout au bout."],
  "4-rencontres.png":["<span>Huit</span> rencontres","Nami, Sylve, Astre… tu finiras avec qui ?"],
  "5-perso.png":["Ton perso, <span>ton style</span>","Des têtes et des couleurs à débloquer en jouant."]
};
const f=new URLSearchParams(location.search).get("img")||"1-jeu.png";
const c=CAPTIONS[f]||["",""];
document.getElementById("t").innerHTML=c[0];
document.getElementById("s").textContent=c[1];
document.getElementById("i").src="raw/"+f;
</script>
</body>
</html>
