<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Date Gravity – tous les écrans, 3 propositions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&family=Caveat:wght@700&family=Sora:wght@600;800&family=Fraunces:ital,wght@1,700;1,900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#14151c;color:#eef0f6;font-family:Nunito,Arial,sans-serif;line-height:1.4}
header.page{max-width:1500px;margin:0 auto;padding:34px 20px 4px}
header.page h1{margin:0 0 6px;font:700 32px/1.1 Fredoka,Arial,sans-serif}
header.page p{margin:0;max-width:820px;color:#b9bdcc}
nav.jump{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
nav.jump a{padding:8px 14px;border-radius:999px;background:#262938;color:#eef0f6;text-decoration:none;font-weight:800;font-size:13px}
section.da{max-width:1500px;margin:28px auto;padding:24px 18px 30px;border-radius:26px;background:#1d1f2a}
section.da>h2{margin:0 0 4px;font-size:34px;line-height:1}
section.da>p{margin:0 0 20px;color:#b9bdcc;max-width:800px}
.phones{display:flex;gap:26px 20px;flex-wrap:wrap;justify-content:center}
.phoneWrap{text-align:center}
.phoneWrap>small{display:block;margin-top:10px;font:800 12px/1 Nunito,Arial,sans-serif;letter-spacing:.08em;color:#9aa0b6;text-transform:uppercase}
.phone{position:relative;width:270px;height:560px;border-radius:38px;border:8px solid #06070b;overflow:hidden;box-shadow:0 22px 50px rgba(0,0,0,.5);text-align:left}

/* ================================================================ structure commune des écrans */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--fText);font-size:13px}
.scr>*{position:relative;z-index:1}
.scr svg{display:block;width:100%;height:100%;overflow:visible}
.ttl{font:var(--fTitle);margin:0}
.muted{color:var(--muted)}
.btn{margin:0 18px;padding:13px 10px;text-align:center;border-radius:var(--rBtn);background:var(--btnBg);color:var(--btnInk);font:var(--fBtn);box-shadow:var(--shBtn)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shCard)}
.btn.sm{padding:10px;font-size:13px}
.card{background:var(--card);border-radius:var(--rCard);box-shadow:var(--shCard)}
.chip{flex:none;white-space:nowrap;display:inline-block;padding:6px 10px;border-radius:999px;background:var(--card);box-shadow:var(--shCard);font-weight:800;font-size:11.5px}
.bar{display:block;height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;height:52px;padding:8px 12px 0}
.round{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shCard);font-weight:900;font-size:13px}

/* 1 menu */
.menu{align-items:stretch}
.logoBig{margin:34px 0 0;text-align:center;font:var(--fLogo);color:var(--logo)}
.tagline{margin:6px 20px 0;text-align:center;font-size:12.5px;color:var(--muted)}
.pair{display:flex;align-items:center;justify-content:center;gap:8px;margin:20px 0 4px}
.pair .amp{font-size:22px;color:var(--accent)}
.frame{width:102px}
.frame .pic{height:92px;border-radius:var(--rPic);background:var(--pic);overflow:hidden;display:grid;place-items:end center}
.frame .pic svg{width:92px;height:92px}
.frame .cap{margin-top:6px;text-align:center;font-weight:800;font-size:12px}
.frame .cap i{display:block;font-style:normal;font-weight:600;font-size:10.5px;color:var(--muted)}
.menu .stack{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.ver{padding-bottom:12px;text-align:center;font-size:10px;color:var(--muted)}

/* 2 chapitres */
.list{flex:1;display:flex;flex-direction:column;gap:8px;padding:8px 12px 12px}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px}
.row .av{flex:none;width:44px;height:44px;border-radius:var(--rAv);background:var(--pic);overflow:hidden}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font:var(--fRow);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx span{display:block;margin:1px 0 5px;font-size:11px;color:var(--muted)}
.row .st{flex:none;font-weight:800;font-size:11.5px;text-align:right}
.row.cur{outline:2.5px solid var(--accent)}
.row.lock{opacity:.55}
.row.lock .av{filter:grayscale(1)}

/* 3 niveaux */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px 8px;padding:10px 14px 0}
.tile{text-align:center;font-weight:800;font-size:10.5px}
.tile .ic{position:relative;aspect-ratio:1;margin-top:3px;border-radius:var(--rTile);background:var(--card);box-shadow:var(--shCard);display:grid;place-items:center;overflow:hidden;font-size:18px}
.tile .ic svg{width:112%;height:112%}
.tile .stars{display:block;height:12px;font-size:9.5px;letter-spacing:1px;color:var(--star)}
.tile.cur .ic{outline:3px solid var(--accent);outline-offset:1px}
.tile.lock .ic{background:var(--track);box-shadow:none;color:var(--muted)}
.tile.boss .ic{background:var(--accent3)}
.pager{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding:0 14px 16px;font-weight:800}

/* 4 profil */
.profile{margin:12px 20px 0;padding:12px}
.profile .pic{height:196px;border-radius:var(--rPic);background:var(--pic);overflow:hidden;display:grid;place-items:end center}
.profile .pic svg{width:190px;height:190px;margin-bottom:-8px}
.profile .name{margin-top:9px;font:var(--fName)}
.profile .bio{margin-top:3px;font-size:12.5px;line-height:1.3;color:var(--muted)}
.tags{display:flex;gap:6px;margin-top:8px}
.tags span{padding:4px 9px;border-radius:6px;font-size:11px;font-weight:800;background:var(--accent3)}
.tags span+span{background:var(--accent2)}
.cta{margin-top:auto;margin-bottom:18px}

/* 5 jeu : une ligne d'en-tête, plateau pleine largeur, bas d'écran pour le pouce */
.who{min-width:0;text-align:center;font:var(--fRow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .who{font-size:13.5px}
.who small{display:block;margin-top:2px;font:800 10px/1 Nunito,Arial,sans-serif;color:var(--muted)}
.moves{flex:none;white-space:nowrap;padding:7px 11px;border-radius:9px;background:var(--ink);color:var(--bgFlat);font-weight:800;font-size:13px}
.moves b{color:var(--accent3)}
.gMid{flex:1;display:grid;place-items:center;padding:0 7px}
.boardWrap{position:relative;width:100%}
.board{position:relative;display:grid;grid-template-columns:repeat(7,1fr);aspect-ratio:1;gap:2px;padding:6px;border-radius:var(--rBoard);background:var(--boardBg);box-shadow:var(--shBoard)}
.board i{display:block;position:relative;border-radius:5px}
.board i svg{position:absolute;inset:-30% -27% -24%;width:154%;height:154%}
.board .w{background:var(--wall)}
.board .h{background:var(--accent3);clip-path:polygon(50% 4%,62% 36%,96% 38%,69% 59%,79% 93%,50% 73%,21% 93%,31% 59%,4% 38%,38% 36%)}
.gFoot{height:112px;padding:0 12px 14px;display:flex;flex-direction:column;justify-content:flex-end;gap:9px}
.react{display:flex;align-items:center;gap:8px}
.react .mini{flex:none;width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--pic)}
.react p{margin:0;padding:8px 11px;border-radius:14px 14px 14px 4px;background:var(--card);box-shadow:var(--shCard);font-size:12px;line-height:1.25}
.thumb{display:flex;align-items:center;gap:8px}
.thumb .reset{padding:9px 10px;border-radius:9px;background:var(--card);box-shadow:var(--shCard);font-size:11px;font-weight:900;white-space:nowrap}
.thumb .arc{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:38px;border-radius:999px;border:2px dashed var(--dash);font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap}
.thumb .arc b{font-size:17px;color:var(--ink)}

/* 6 victoire */
.win{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 16px;background:var(--winBg);color:var(--winInk)}
.win .duo{display:flex;align-items:flex-end}
.win .duo span{width:118px;height:118px}
.win .duo span+span{margin-left:-24px}
.win h3{margin:14px 0 4px;font:var(--fWin)}
.win .hearts{font-size:22px;letter-spacing:4px;margin:6px 0 2px}
.win .btn{align-self:stretch;margin:16px 6px 0}
.win .btn+.btn{margin-top:9px}
.win .btn:not(.ghost){background:var(--winBtn);color:var(--winBtnInk);box-shadow:var(--winBtnSh)}

/* 7-8-9 : fenêtres posées sur le jeu */
.overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:flex-end;background:var(--dim)}
.overlay.mid{align-items:center}
.modal{width:100%;padding:16px 4px 18px;border-radius:var(--rModal) var(--rModal) 0 0;background:var(--bgFlat);box-shadow:0 -10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:9px}
.overlay.mid .modal{margin:0 14px;border-radius:var(--rModal);padding-top:14px}
.modal h3{margin:0 18px 2px;text-align:center;font:var(--fTitle)}
.modal p{margin:0 20px;text-align:center;font-size:12.5px;color:var(--muted)}
.modal .sad{width:104px;height:104px;margin:0 auto}
.sl{display:flex;align-items:center;gap:10px;margin:0 20px;font-weight:800;font-size:12px}
.sl span{width:58px}.sl .bar{flex:1;height:8px}
.two{display:flex;gap:9px;margin:0 18px}.two .btn{flex:1;margin:0}
.seq{display:flex;justify-content:center;gap:8px;margin:4px 0}
.seq b{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--card);box-shadow:var(--shCard)}
.seq b.r{background:var(--accent);color:var(--btnInkAlt)}
.adtag{display:inline-block;margin-left:5px;padding:2px 6px;border-radius:5px;background:var(--accent3);color:var(--ink);font:800 9.5px/1.2 Nunito,Arial,sans-serif;vertical-align:middle}

/* ================================================================ A. POP PORTRAITS */
.ta{--bg:#fbf3e7 radial-gradient(#33261f12 1px,transparent 1.2px) 0 0/11px 11px;--bgFlat:#fbf3e7;--ink:#33261f;--muted:#8a7467;--card:#fff;--pic:#9be3d8;
  --accent:#ff6b5e;--accent2:#9be3d8;--accent3:#ffd166;--track:#eadfce;--star:#f0a500;--wall:#33261f;--boardBg:#fff;--dash:#33261f44;--dim:rgba(51,38,31,.42);
  --logo:#ff6b5e;--btnBg:#ff6b5e;--btnInk:#fff;--btnInkAlt:#fff;--rBtn:999px;--rCard:16px;--rPic:6px;--rAv:10px;--rTile:14px;--rBoard:18px;--rModal:26px;
  --shBtn:0 6px 0 #c9443b;--shCard:0 3px 0 rgba(51,38,31,.1);--shBoard:0 12px 26px rgba(51,38,31,.18);
  --fText:Nunito,Arial,sans-serif;--fTitle:700 24px/1.05 Fredoka,Arial,sans-serif;--fLogo:700 44px/.9 Fredoka,Arial,sans-serif;--fBtn:700 17px/1 Fredoka,Arial,sans-serif;
  --fRow:700 15px/1.1 Fredoka,Arial,sans-serif;--fName:700 26px/1 Caveat,cursive;--fWin:700 37px/.95 Caveat,cursive;
  --winBg:#ff6b5e;--winInk:#fff;--winBtn:#fff;--winBtnInk:#ff6b5e;--winBtnSh:0 6px 0 rgba(0,0,0,.14)}
.ta h2{font-family:Fredoka,Arial,sans-serif;color:#ff6b5e}
.ta .frame,.ta .profile{position:relative;padding:8px 8px 10px;background:#fff;border-radius:5px;box-shadow:0 10px 20px rgba(51,38,31,.2)}
.ta .frame.f1{transform:rotate(-5deg)}.ta .frame.f2{transform:rotate(4deg)}.ta .frame.f2 .pic{background:#ffd166}
.ta .profile{transform:rotate(-2.5deg);padding:12px 12px 14px}
.ta .frame::before,.ta .profile::before{content:"";position:absolute;left:50%;top:-9px;width:54px;height:18px;margin-left:-27px;background:#ffd166cc;transform:rotate(3deg)}
.ta .frame .cap{font:700 18px/1 Caveat,cursive}.ta .frame .cap i{font:600 10.5px Nunito,Arial,sans-serif;margin-top:2px}
.ta .win .duo span{padding:6px 6px 9px;background:#fff;border-radius:5px;box-shadow:0 10px 20px #0003;transform:rotate(-7deg);width:108px;height:auto}
.ta .win .duo span+span{transform:rotate(6deg)}
.ta .win .duo svg{background:#9be3d8;border-radius:3px;height:92px}
.ta .win .duo span+span svg{background:#ffd166}

/* ================================================================ B. PAPIER CRUSH */
.tb{--bg:#f7f1e3;--bgFlat:#f7f1e3;--ink:#232a5c;--muted:#6a7098;--card:#fff;--pic:#dfe6ff;
  --accent:#ff6a55;--accent2:#8fd9c4;--accent3:#ffcf4a;--track:#e6dfcd;--star:#ff6a55;--wall:#232a5c;--boardBg:#fff;--dash:#232a5c55;--dim:rgba(35,42,92,.4);
  --logo:#232a5c;--btnBg:#232a5c;--btnInk:#f7f1e3;--btnInkAlt:#fff;--rBtn:11px;--rCard:10px;--rPic:6px;--rAv:8px;--rTile:9px;--rBoard:12px;--rModal:18px;
  --shBtn:4px 5px 0 #ff6a55;--shCard:0 2px 0 rgba(35,42,92,.14);--shBoard:0 10px 22px rgba(35,42,92,.16);
  --fText:Nunito,Arial,sans-serif;--fTitle:italic 900 25px/1.05 Fraunces,Georgia,serif;--fLogo:italic 900 46px/.88 Fraunces,Georgia,serif;--fBtn:italic 900 18px/1 Fraunces,Georgia,serif;
  --fRow:italic 900 15.5px/1.1 Fraunces,Georgia,serif;--fName:italic 900 25px/1 Fraunces,Georgia,serif;--fWin:italic 900 31px/.98 Fraunces,Georgia,serif;
  --winBg:#f7f1e3;--winInk:#232a5c;--winBtn:#232a5c;--winBtnInk:#f7f1e3;--winBtnSh:4px 5px 0 #ff6a55}
.tb h2{font:italic 900 38px/1 Fraunces,Georgia,serif;color:#ffcf4a}
.tb .scr svg{filter:drop-shadow(1.5px 2.5px 0 rgba(35,42,92,.16))}
.tb .scr::before,.tb .scr::after{content:"";position:absolute;z-index:0;pointer-events:none}
.tb .scr::before{width:210px;height:190px;right:-80px;top:-70px;background:#ffcf4a;border-radius:58% 42% 61% 39%/47% 60% 40% 53%;transform:rotate(-12deg)}
.tb .scr::after{width:220px;height:170px;left:-100px;bottom:-60px;background:#8fd9c4;border-radius:40% 60% 36% 64%/58% 41% 59% 42%;transform:rotate(9deg)}
.tb .btn:not(.ghost){transform:rotate(-1deg)}
.tb .frame,.tb .profile{position:relative}
.tb .frame::before,.tb .profile::before{content:"";position:absolute;inset:0;border-radius:9px;background:#ff6a55;transform:rotate(-5deg);z-index:-1}
.tb .frame.f2::before{background:#8fd9c4;transform:rotate(5deg)}
.tb .frame{padding:7px;border-radius:9px}
.tb .frame::before{z-index:-2}
.tb .frame::after{content:"";position:absolute;inset:0;z-index:-1;background:#fff;border-radius:9px;box-shadow:0 8px 16px rgba(35,42,92,.14)}
.tb .profile{background:none;box-shadow:none}
.tb .profile::before{z-index:-2}
.tb .profile::after{content:"";position:absolute;inset:0;z-index:-1;background:#fff;border-radius:10px;box-shadow:0 10px 20px rgba(35,42,92,.14)}
.tb .boardWrap::before{content:"";position:absolute;inset:-3px;border-radius:14px;background:#ff6a55;transform:rotate(-2.2deg)}
.tb .board .w:nth-child(3n){transform:rotate(2deg)}.tb .board .w:nth-child(4n+1){transform:rotate(-2.5deg)}
.tb .moves{transform:rotate(2deg)}
.tb .tile:nth-child(odd) .ic{transform:rotate(-2deg)}.tb .tile:nth-child(3n) .ic{transform:rotate(2.5deg)}
.tb .win::before{content:"";position:absolute;top:70px;left:50%;width:250px;height:230px;margin-left:-125px;background:#ff6a55;clip-path:path("M125 225 L20 115 Q-15 55 35 22 Q85 -5 125 50 Q165 -5 215 22 Q265 55 230 115Z")}
.tb .win>*{position:relative}

/* ================================================================ C. PETIT MESSAGE */
.tc{--bg:linear-gradient(170deg,#fff1ea 0,#ffe6ef 45%,#ece6ff 100%);--bgFlat:#fff4f0;--ink:#43305c;--muted:#9583b3;--card:#fff;--pic:radial-gradient(circle at 50% 70%,#fff,#ffd9c9 55%,#ffc6dc);
  --accent:#ff8f7a;--accent2:#d9ceff;--accent3:#ffd9a8;--track:#eadff7;--star:#ffab4a;--wall:#bfaef9;--boardBg:#fff;--dash:#b9a6ff;--dim:rgba(67,48,92,.32);
  --logo:#ff7a6b;--btnBg:linear-gradient(90deg,#ff8f7a,#ffb86b);--btnInk:#fff;--btnInkAlt:#fff;--rBtn:16px;--rCard:20px;--rPic:18px;--rAv:50%;--rTile:16px;--rBoard:20px;--rModal:28px;
  --shBtn:0 8px 18px #ff8f7a55;--shCard:0 6px 16px #b9a6ff3d;--shBoard:0 16px 34px #b9a6ff55;
  --fText:Sora,Arial,sans-serif;--fTitle:800 21px/1.1 Sora,Arial,sans-serif;--fLogo:800 36px/.95 Sora,Arial,sans-serif;--fBtn:800 15px/1 Sora,Arial,sans-serif;
  --fRow:800 13.5px/1.15 Sora,Arial,sans-serif;--fName:800 20px/1 Sora,Arial,sans-serif;--fWin:800 29px/1.05 Sora,Arial,sans-serif;
  --winBg:radial-gradient(circle at 50% 34%,#fff 0,#ffd9c9 34%,#ffc6dc 66%,#e6dcff 100%);--winInk:#43305c;--winBtn:linear-gradient(90deg,#ff8f7a,#ffb86b);--winBtnInk:#fff;--winBtnSh:0 8px 18px #ff8f7a55}
.tc h2{font:800 34px/1 Sora,Arial,sans-serif;color:#ff8f7a}
.tc .scr{font-size:12px}
.tc .frame{padding:8px;background:#fff;border-radius:22px;box-shadow:0 8px 20px #b9a6ff44}
.tc .frame .pic{border-radius:50%;height:86px}
.tc .profile{background:#fff;border-radius:24px;box-shadow:0 16px 34px #b9a6ff55}
.tc .win h3{color:#ff6b7f}
.tc .row .av{position:relative;overflow:visible}
.tc .row .av svg{border-radius:50%;background:var(--pic)}
.tc .row:not(.lock) .av::after{content:"";position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#2fd58a;border:2px solid #fff}
.tc .board{padding:5px;gap:3px}.tc .board i{border-radius:7px}
.tc .bubble{align-self:flex-start;margin:8px 18px 0;padding:8px 11px;border-radius:16px 16px 16px 4px;background:#fff;box-shadow:var(--shCard);font-size:12px}
/* ================================================================ MENU : effets
   Tout est en CSS (transform/opacity/background-position), donc léger sur mobile. */
.scr>.fx{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.fx i{position:absolute;left:var(--x);bottom:-30px;font-style:normal;font-size:var(--s);animation:fxRise var(--t) linear var(--d) infinite}
@keyframes fxRise{0%{transform:translateY(0) rotate(-10deg);opacity:0}12%{opacity:var(--o,.7)}85%{opacity:var(--o,.7)}100%{transform:translate(var(--dx,20px),-620px) rotate(25deg);opacity:0}}
@keyframes fxFall{0%{transform:translateY(-640px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx,20px),40px) rotate(300deg);opacity:.9}}
.mTop{display:flex;justify-content:space-between;padding:14px 14px 0}
.menu .logoBig{margin-top:8px}
.menu .tagline{margin-top:10px}
.logoBig span{display:block}
.pair{position:relative}
.frame{position:relative;animation:mFloat 3.4s ease-in-out infinite}
.frame.f2{animation-delay:-1.7s}
@keyframes mFloat{50%{translate:0 -7px}}
.pair .amp{animation:mBeat 1.3s ease-in-out infinite}
@keyframes mBeat{0%,100%{transform:scale(.9)}30%{transform:scale(1.35)}45%{transform:scale(1.05)}60%{transform:scale(1.25)}}
/* reflet holographique type carte à collectionner */
.pic{position:relative}
.holo{position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;overflow:hidden}
.holo::before{content:"";position:absolute;inset:0;opacity:.15;mix-blend-mode:color-dodge;
  background:repeating-linear-gradient(115deg,#ff5ea8 0 8%,#ffd95e 8% 16%,#5effc4 16% 24%,#5ec8ff 24% 32%,#b68bff 32% 40%);
  background-size:300% 300%;animation:holoShift 6s linear infinite}
.holo::after{content:"";position:absolute;inset:-20%;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.85) 48%,rgba(255,255,255,.15) 54%,transparent 62%);
  transform:translateX(-120%);animation:holoSweep 3.6s ease-in-out infinite}
.f2 .holo::after{animation-delay:1.2s}
@keyframes holoShift{to{background-position:300% 0}}
@keyframes holoSweep{0%,35%{transform:translateX(-120%)}70%,100%{transform:translateX(120%)}}
.spark{position:absolute;z-index:3;font-size:var(--s,14px);color:var(--sparkC,#fff);animation:twinkle 1.8s ease-in-out var(--d,0s) infinite;pointer-events:none}
@keyframes twinkle{0%,100%{transform:scale(.2) rotate(0);opacity:0}50%{transform:scale(1) rotate(40deg);opacity:1}}
/* bouton principal : balayage de lumière + halo qui respire */
.btn.play{position:relative;overflow:hidden;padding:12px 10px 11px}
.btn.play small{display:block;margin-top:4px;font:800 10.5px/1 Nunito,Arial,sans-serif;letter-spacing:.04em;opacity:.85}
.btn.play::after{content:"";position:absolute;top:-20%;bottom:-20%;left:-40%;width:34%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:btnShine 3.2s ease-in-out infinite}
@keyframes btnShine{0%,55%{left:-40%}85%,100%{left:120%}}
.menu .stack{gap:9px}
.menu .two{margin:0 18px}
.badge{position:absolute;z-index:4;pointer-events:none}
@media (prefers-reduced-motion:reduce){.menu *,.menu *::before,.menu *::after,.fx i{animation:none!important}}

/* --- A : logo autocollant, cœurs qui montent, tampon LIKE qui claque */
.ta .logoBig span{text-shadow:0 3px 0 #c9443b,0 7px 0 rgba(51,38,31,.12);animation:aBounce 2.6s ease-in-out infinite}
.ta .logoBig span+span{color:#33261f;text-shadow:0 3px 0 #ffd166,0 7px 0 rgba(51,38,31,.12);animation-delay:-.35s;transform-origin:50% 100%}
@keyframes aBounce{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(2deg) scale(1.05)}}
.ta .fx i{color:#ff6b5e}.ta .fx i:nth-child(even){color:#5cc8c0}.ta .fx i:nth-child(3n){color:#ffd166}
.ta .frame.f1{animation-name:aF1}.ta .frame.f2{animation-name:aF2}
@keyframes aF1{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(-3deg) translateY(-7px)}}
@keyframes aF2{0%,100%{transform:rotate(5deg)}50%{transform:rotate(2deg) translateY(-7px)}}
.ta .badge{right:-8px;top:14px;padding:3px 8px;border:3px solid #ff6b5e;border-radius:8px;color:#ff6b5e;background:#fff;font:700 15px/1 Fredoka,Arial,sans-serif;animation:aStamp 3.6s cubic-bezier(.2,1.6,.4,1) infinite}
@keyframes aStamp{0%,55%{transform:rotate(14deg) scale(2.2);opacity:0}62%,92%{transform:rotate(14deg) scale(1);opacity:1}100%{transform:rotate(14deg) scale(1);opacity:0}}
.ta .btn.play{animation:aPulse 2s ease-in-out infinite}
@keyframes aPulse{50%{box-shadow:0 6px 0 #c9443b,0 0 0 9px rgba(255,107,94,.16)}}

/* --- B : papiers qui tombent, formes qui respirent, pastille dorée qui brille */
.tb .logoBig span{text-shadow:3px 3px 0 #ffcf4a}
.tb .logoBig span+span{color:#ff6a55;text-shadow:3px 3px 0 #232a5c;transform:rotate(-4deg);animation:bSway 3s ease-in-out infinite}
@keyframes bSway{50%{transform:rotate(-1deg) translateX(3px)}}
.tb .menu::before{animation:bBlob 9s ease-in-out infinite}
.tb .menu::after{animation:bBlob 11s ease-in-out -4s infinite reverse}
@keyframes bBlob{50%{border-radius:42% 58% 39% 61%/60% 44% 56% 40%;transform:rotate(8deg) scale(1.08)}}
.tb .fx i{bottom:auto;top:0;width:var(--s);height:calc(var(--s)*.7);font-size:0;background:#ff6a55;border-radius:2px;animation-name:fxFall}
.tb .fx i:nth-child(even){background:#232a5c;border-radius:50%;height:var(--s)}
.tb .fx i:nth-child(3n){background:#8fd9c4;clip-path:polygon(50% 0,100% 100%,0 100%)}
.tb .fx i:nth-child(4n){background:#ffcf4a}
.tb .frame.f1{animation-name:bF1}.tb .frame.f2{animation-name:bF2}
@keyframes bF1{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(-1deg) translateY(-6px)}}
@keyframes bF2{0%,100%{transform:rotate(4deg)}50%{transform:rotate(1deg) translateY(-6px)}}
.tb .frame::before{animation:bSheet 3.4s ease-in-out infinite}
@keyframes bSheet{50%{transform:rotate(-9deg) translate(-2px,2px)}}
.tb .holo::before{opacity:.1}
.tb .badge{right:-14px;top:-12px;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;text-align:center;color:#232a5c;font:italic 900 10.5px/1 Fraunces,Georgia,serif;transform:rotate(14deg);
  background:conic-gradient(#ffe79a,#ffcf4a,#fff6cf,#e0a92a,#ffe79a,#ffcf4a,#fff6cf,#e0a92a,#ffe79a);box-shadow:0 3px 0 rgba(35,42,92,.25);animation:bFoil 5s linear infinite}
@keyframes bFoil{to{transform:rotate(374deg)}}
.tb .badge b{display:block;animation:bFoilTxt 5s linear infinite}
@keyframes bFoilTxt{to{transform:rotate(-360deg)}}
.tb .btn.play{transform:rotate(-1deg);animation:bPress 2.4s ease-in-out infinite}
@keyframes bPress{50%{transform:rotate(-1deg) translate(2px,2px);box-shadow:2px 3px 0 #ff6a55}}

/* --- C : fond qui ondule, cartes à liseré irisé, message qui arrive */
.tc .menu{background:linear-gradient(120deg,#fff1ea,#ffdfee,#e8e0ff,#dff1ff,#fff1ea);background-size:300% 300%;animation:cAurora 12s ease-in-out infinite}
@keyframes cAurora{50%{background-position:100% 60%}}
.tc .logoBig span{background:linear-gradient(90deg,#ff7a6b,#ffb86b,#ff8fc0,#a98bff,#ff7a6b);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:cLogo 5s linear infinite;filter:drop-shadow(0 4px 10px #ff8f7a44)}
@keyframes cLogo{to{background-position:300% 0}}
.tc .fx i{width:var(--s);height:var(--s);font-size:0;border-radius:50%;background:radial-gradient(circle,#fff,#ffffff00 70%);--o:.9}
.tc .fx i:nth-child(odd){background:radial-gradient(circle,#ffc6dc,#ffc6dc00 70%)}
.tc .frame{background:none;box-shadow:none;padding:11px}
.tc .frame::before{content:"";position:absolute;inset:0;z-index:-2;border-radius:24px;background:conic-gradient(from var(--a,0deg),#ff8f7a,#ffd36b,#8be8c8,#8fc4ff,#c9a6ff,#ff8fc0,#ff8f7a);animation:cSpin 5s linear infinite;box-shadow:0 10px 24px #b9a6ff55}
.tc .frame::after{content:"";position:absolute;inset:3px;z-index:-1;border-radius:21px;background:#fff}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes cSpin{to{--a:360deg}}
.tc .badge{right:-4px;top:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;display:grid;place-items:center;background:#ff5c7a;color:#fff;font:800 11px/1 Sora,Arial,sans-serif;box-shadow:0 0 0 3px #fff;animation:cPing 1.6s ease-out infinite}
@keyframes cPing{0%{box-shadow:0 0 0 3px #fff,0 0 0 3px #ff5c7a88}100%{box-shadow:0 0 0 3px #fff,0 0 0 14px #ff5c7a00}}
.tc .msg{align-self:center;margin:12px 0 0;padding:8px 12px;border-radius:16px 16px 16px 4px;background:#fff;box-shadow:var(--shCard);font-size:12px;animation:cPop 4.5s cubic-bezier(.2,1.5,.4,1) infinite;transform-origin:0 100%}
@keyframes cPop{0%,8%{transform:scale(0);opacity:0}16%,88%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:0}}
.tc .btn.play{animation:cGlow 2.4s ease-in-out infinite}
@keyframes cGlow{50%{box-shadow:0 8px 26px #ff8f7a99,0 0 0 7px #ff8f7a1f}}

/* ================================================================ MENU A, 2e passe
   Cartes plus grandes, fond moins vide, et rendu "carte brillante" : le fond du portrait est
   un foil irisé qui scintille, le personnage reste mat et détouré par-dessus. */
.ta .menu .pair{gap:0;margin:40px 0 0;isolation:isolate}
.ta .menu .logoBig{margin-top:0;font-size:45px}
.ta .menu .mTop{padding-top:10px}
.ta .menu .tagline{margin-top:14px}
.ta .menu .btn.play{margin-bottom:14px}
/* les petits points du fond glissent en diagonale, une maille toutes les 7 s : boucle sans raccord */
.ta .menu{animation:aDots 7s linear infinite}
@keyframes aDots{to{background-position:11px 11px}}
@media (prefers-reduced-motion:reduce){.ta .menu{animation:none}}
.ta .menu .pair::before{content:"";position:absolute;left:50%;top:50%;width:330px;height:330px;margin:-165px 0 0 -165px;z-index:-1;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,107,94,.13) 0 9deg,transparent 9deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 68%);mask:radial-gradient(circle,#000 30%,transparent 68%);animation:aRays 40s linear infinite}
@keyframes aRays{to{transform:rotate(360deg)}}
.ta .menu .frame{width:124px;padding:9px 9px 12px;border-radius:7px;box-shadow:0 14px 26px rgba(51,38,31,.24)}
.ta .menu .frame.f2{margin-left:-12px;z-index:1}
.ta .menu .frame .pic{height:144px;place-items:center;--foil:linear-gradient(125deg,#8fe0d4,#c6f1ff,#ffe3f1,#fff4c9,#c9f6e4,#a5e6ff,#8fe0d4)}
.ta .menu .frame.f2 .pic{--foil:linear-gradient(125deg,#ffd166,#ffe9a8,#ffd0e2,#fff6d6,#ffc79a,#ffe08a,#ffd166)}
.ta .menu .frame .pic svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;width:126px;height:126px;
  filter:drop-shadow(1.6px 0 0 #fff) drop-shadow(-1.6px 0 0 #fff) drop-shadow(0 -1.6px 0 #fff) drop-shadow(0 1.6px 0 #fff) drop-shadow(0 4px 3px rgba(51,38,31,.28))}
.ta .menu .frame .cap{font-size:21px;margin-top:8px}
.ta .menu .frame .cap i{font-size:0}
.ta .menu .frame .cap i::after{content:"changer ↻";font-size:10.5px}
.ta .menu .pair .amp{position:absolute;left:50%;top:40%;z-index:5;width:34px;height:34px;margin-left:-23px;border-radius:50%;display:grid;place-items:center;background:#fff;font-size:18px;box-shadow:0 4px 0 rgba(51,38,31,.14)}
.ta .menu .badge{right:-2px;top:22px;z-index:6}
/* foil : dégradé irisé continu qui glisse lentement, sans bandes */
.ta .menu .holo{z-index:0}
.ta .menu .holo::before{opacity:1;mix-blend-mode:normal;background:var(--foil);background-size:320% 320%;animation:aFoil 7s ease-in-out infinite alternate}
@keyframes aFoil{to{background-position:100% 100%}}
/* éclat de lumière : il passe derrière le personnage */
.ta .menu .holo::after{inset:-30%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.95) 49%,rgba(255,255,255,.35) 53%,transparent 60%);animation-duration:3.2s}
/* rayons très fins + paillettes qui scintillent, toujours derrière le personnage */
.ta .menu .pic::before,.ta .menu .pic::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none}
.ta .menu .pic::before{background:repeating-conic-gradient(from 0deg at 50% 62%,rgba(255,255,255,.34) 0 4deg,transparent 4deg 11deg);animation:aRayPulse 4s ease-in-out infinite}
@keyframes aRayPulse{50%{opacity:.35}}
.ta .menu .pic::after{background:
    radial-gradient(circle,#fff 0 1.1px,transparent 1.7px) 3px 5px/19px 23px,
    radial-gradient(circle,#fff 0 .8px,transparent 1.4px) 11px 14px/13px 17px;
  animation:aGlitter 2.2s steps(2,jump-none) infinite}
.ta .menu .f2 .pic::after{animation-delay:-1.1s}
@keyframes aGlitter{0%{opacity:.95;background-position:3px 5px,11px 14px}50%{opacity:.5;background-position:9px 12px,4px 6px}100%{opacity:.95;background-position:3px 5px,11px 14px}}
/* léger reflet verni sur toute la carte, très discret, pour l'effet plastifié */
.ta .menu .frame::after{content:"";position:absolute;inset:0;z-index:4;border-radius:inherit;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.34) 0,rgba(255,255,255,0) 32%)}

/* éléments du jeu masqués tant qu'une proposition ne les habille pas */
.scr>.gfx{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.gfx .spark,.grav,.pips,.knob{display:none}

/* ================================================================ JEU A, version immersive
   Le plateau devient un objet : cadre épais, sol en damier, blocs en relief, personnages détourés.
   Autour, la scène vit (rayons, points qui glissent, étincelles) sans jamais passer sur le plateau. */
.ta .game{animation:aDots 7s linear infinite}
.ta .gfx::before{content:"";position:absolute;left:50%;top:47%;width:640px;height:640px;margin:-320px 0 0 -320px;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,107,94,.17) 0 8deg,transparent 8deg 16deg);
  -webkit-mask:radial-gradient(circle,#000 18%,transparent 62%);mask:radial-gradient(circle,#000 18%,transparent 62%);animation:aRays 50s linear infinite}
.ta .gfx::after{content:"";position:absolute;left:0;right:0;top:0;height:150px;background:linear-gradient(180deg,#ffd9cf,rgba(255,217,207,0))}
.ta .gfx .spark{display:block;--sparkC:#ffb300}
/* en-tête */
.ta .game .who{font:700 27px/1 Caveat,cursive;overflow:visible}
.ta .game .who small{margin-top:0}
.ta .game .moves{background:#fff;color:#33261f;box-shadow:0 3px 0 rgba(51,38,31,.12);padding:6px 9px;border-radius:999px}
.ta .mv{display:none}
.ta .pips{display:flex;align-items:center;gap:4px}
.ta .pips em{margin-right:2px;font:800 10px/1 Nunito,Arial,sans-serif;font-style:normal;color:#8a7467}
.ta .pips i{width:11px;height:11px;border-radius:50%;background:#eadfce}
.ta .pips i.on{background:#ff6b5e;box-shadow:inset 0 -2px 0 #c9443b}
.ta .pips i.on:nth-of-type(2){animation:gPip 1.6s ease-in-out infinite}
@keyframes gPip{50%{transform:scale(1.35)}}
/* plateau */
.ta .game .gMid{padding:0 9px}
.ta .game .boardWrap{padding:8px;border-radius:24px;background:none;box-shadow:0 8px 0 #e79a8c,0 26px 30px rgba(51,38,31,.3);animation:gHover 4s ease-in-out infinite}
@keyframes gHover{50%{transform:translateY(-4px)}}
.ta .game .boardWrap::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:24px;
  background:linear-gradient(125deg,#ff6b5e,#ffd166,#5cc8c0,#ffe3f1,#ffd166,#ff6b5e);background-size:320% 320%;animation:aFoil 5s ease-in-out infinite alternate}
.ta .game .boardWrap::after{content:"";position:absolute;left:50%;top:-12px;width:78px;height:22px;margin-left:-39px;background:#ffd166dd;transform:rotate(-2deg);box-shadow:0 2px 3px rgba(51,38,31,.15)}
.ta .game .board{gap:0;padding:5px;border-radius:17px;background:#fff8ee;box-shadow:0 0 0 3px #33261f}
.ta .game .board i{border-radius:0;background:#fff8ee}
.ta .game .board i:nth-child(odd){background:#f7ead6}
.ta .game .board i.w{border-radius:8px;background:#45c4b8;box-shadow:inset 0 -6px 0 #2b9a90,inset 0 3px 0 #9fece3;transform:scale(.94)}
.ta .game .board i.h{background:#ffc93c;filter:drop-shadow(0 0 5px #ffb300);animation:gStar 2.4s ease-in-out infinite}
@keyframes gStar{0%,100%{transform:rotate(-12deg) scale(.82)}50%{transform:rotate(14deg) scale(1.02)}}
/* personnages : plus grands, détourés comme sur les cartes du menu */
.ta .game .board i svg{inset:-38% -35% -32%;width:170%;height:170%;z-index:2;
  filter:drop-shadow(1.2px 0 0 #fff) drop-shadow(-1.2px 0 0 #fff) drop-shadow(0 -1.2px 0 #fff) drop-shadow(0 1.2px 0 #fff) drop-shadow(0 3px 1px rgba(51,38,31,.35))}
.ta .game .cp svg{animation:gBob .9s ease-in-out infinite}
@keyframes gBob{50%{transform:translateY(-3px) rotate(-3deg)}}
.ta .game .cd::before{content:"";position:absolute;inset:-45%;z-index:1;border-radius:50%;background:radial-gradient(circle,rgba(255,107,94,.55),rgba(255,107,94,0) 68%);animation:gHalo 1.5s ease-in-out infinite}
@keyframes gHalo{50%{transform:scale(1.3);opacity:.55}}
.ta .game .cd::after{content:"♥";position:absolute;left:62%;top:-30%;z-index:3;font-size:13px;color:#ff6b5e;animation:gHeart 1.8s ease-out infinite}
@keyframes gHeart{0%{transform:translateY(6px) scale(.4);opacity:0}30%{opacity:1}100%{transform:translate(6px,-22px) scale(1.1);opacity:0}}
.ta .grav{display:grid;place-items:center;position:absolute;left:50%;bottom:-17px;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:#ffd166;color:#33261f;font-weight:900;font-size:16px;box-shadow:0 3px 0 #d9a73f;animation:gGrav 1.1s ease-in-out infinite}
@keyframes gGrav{50%{transform:translateY(4px)}}
/* bas d'écran */
.ta .game .react .mini{width:44px;height:44px;border-radius:6px;border:3px solid #fff;background:#9be3d8;transform:rotate(-7deg);box-shadow:0 5px 10px rgba(51,38,31,.22)}
.ta .game .gFoot{gap:20px}
.ta .game .react p{font-weight:800;animation:gPop 5s cubic-bezier(.2,1.6,.4,1) infinite;transform-origin:0 100%}
@keyframes gPop{0%,4%{transform:scale(.6);opacity:0}10%,100%{transform:scale(1);opacity:1}}
.ta .game .thumb .reset{border-radius:999px;padding:11px 12px}
.ta .game .thumb .arc{position:relative;justify-content:space-between;height:44px;padding:0 12px;border:0;background:#fff;box-shadow:inset 0 3px 0 rgba(51,38,31,.08),0 3px 0 rgba(51,38,31,.1);overflow:visible}
.ta .game .thumb .arc b{z-index:1;font-size:20px;color:#5cc8c0}
.ta .game .thumb .arc b:last-child{color:#ff6b5e}
.ta .game .thumb .arc .lbl{position:absolute;left:0;right:0;top:-15px;text-align:center;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#8a7467}
.ta .knob{display:block;position:absolute;left:50%;top:50%;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;background:#ff6b5e;box-shadow:inset 0 -4px 0 #c9443b,0 0 0 5px rgba(255,107,94,.18);animation:gKnob 2.6s ease-in-out infinite}
@keyframes gKnob{0%,100%{transform:translateX(0)}22%{transform:translateX(46px)}50%{transform:translateX(0)}72%{transform:translateX(-46px)}}
@media (prefers-reduced-motion:reduce){.ta .game,.ta .game *,.ta .game *::before,.ta .game *::after{animation:none!important}}

</style>
</head>
<body>
<header class="page">
  <h1>Date Gravity – tous les écrans</h1>
  <p>Les neuf écrans importants du jeu, déclinés dans les trois propositions. Même structure partout, pour comparer à périmètre égal : seuls le style, les personnages et le ton changent.</p>
  <nav class="jump"><a href="#a">A · Pop Portraits</a><a href="#b">B · Papier Crush</a><a href="#c">C · Petit Message</a></nav>
</header>
<div id="root"></div>

<script>
/* Générateur de personnages, identique à da_swipe_pop_variantes.html */
function chr(o){
  const ink=o.ink||"#33261f", st=o.outline?' stroke="'+ink+'" stroke-width="'+o.outline+'" stroke-linejoin="round"':"";
  const hairC=o.hairC||ink;
  let s='<svg viewBox="-6 -10 112 116" xmlns="http://www.w3.org/2000/svg">';
  // membres (variante B)
  if(o.limbs){
    const L='fill="none" stroke="'+ink+'" stroke-width="5" stroke-linecap="round"';
    const armL={wave:"M16 58 Q2 50 4 32",down:"M16 62 Q4 68 6 80",hide:"M16 62 Q22 44 34 50",give:"M16 62 Q4 60 0 52"}[o.limbs]||"M16 62 Q4 68 6 80";
    const armR={wave:"M84 62 Q96 68 94 80",down:"M84 62 Q96 68 94 80",hide:"M84 62 Q78 44 66 50",give:"M84 60 Q98 54 100 44"}[o.limbs]||"M84 62 Q96 68 94 80";
    s+='<path d="M36 86 V99 H30" '+L+'/><path d="M64 86 V99 H70" '+L+'/><path d="'+armL+'" '+L+'/><path d="'+armR+'" '+L+'/>';
    if(o.limbs==="give")s+='<path d="M100 40 c-5-8-15-1-8 6 l8 8 8-8 c7-7-3-14-8-6z" fill="#ff5d8f" stroke="'+ink+'" stroke-width="3" transform="translate(0,-10) scale(.8) translate(26,6)"/>';
  }
  // buste (épaules + vêtement) : la tête-cube est alors réduite et remontée
  if(o.bust){
    const cl=o.bustC||"#ff6a55";
    s+='<path d="M2 108 Q3 80 30 76 H70 Q97 80 98 108Z" fill="'+cl+'"/>';
    if(o.bust==="turtle")s+='<path d="M36 68 H64 L66 82 H34Z" fill="'+cl+'"/><path d="M35 76 H65" stroke="#0002" stroke-width="2"/>';
    if(o.bust==="shirt")s+='<path d="M38 74 L50 90 L62 74 L70 80 L58 94 L50 88 L42 94 L30 80Z" fill="#fff"/>';
    if(o.bust==="hoodie")s+='<path d="M30 78 Q50 96 70 78" fill="none" stroke="#0003" stroke-width="5" stroke-linecap="round"/><path d="M44 88 V100 M56 88 V100" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>';
    s+='<g transform="translate(9 -9) scale(.82)">';
  }
  // cheveux derrière
  if(o.hair==="bob")s+='<rect x="6" y="12" width="88" height="66" rx="28" fill="'+hairC+'"'+st+'/>';
  // corps
  if(o.paper)s+='<path d="M19 22 L82 18 L85 83 L17 86Z" fill="'+o.body+'" stroke="'+o.body+'" stroke-width="9" stroke-linejoin="round"/>';
  else s+='<rect x="14" y="18" width="72" height="70" rx="18" fill="'+o.body+'"'+st+'/>';
  if(!o.outline&&!o.paper)s+='<path d="M14 70 V72 a18 18 0 0 0 18 16 H68 a18 18 0 0 0 18-16 V70 a18 18 0 0 1-18 12 H32 a18 18 0 0 1-18-12z" fill="#000" opacity=".13"/>';
  // cheveux devant
  const hs='fill="'+hairC+'"'+st;
  if(o.hair==="bob"||o.hair==="bun")s+='<path d="M14 42 Q14 16 50 16 Q86 16 86 42 Q72 26 50 30 Q30 26 14 42Z" '+hs+'/>';
  if(o.hair==="bun")s+='<circle cx="50" cy="8" r="12" '+hs+'/>';
  if(o.hair==="tuft")s+='<path d="M28 24 Q36 2 50 16 Q56 0 66 16 Q76 10 74 26 Q50 16 28 24Z" '+hs+'/>';
  if(o.hair==="curly")[[26,21,12],[42,13,13],[60,13,13],[76,21,12],[15,35,9],[85,35,9]].forEach(c=>{s+='<circle cx="'+c[0]+'" cy="'+c[1]+'" r="'+c[2]+'" '+hs+'/>';});
  if(o.hair==="flat")s+='<path d="M14 38 V34 Q14 16 50 16 Q86 16 86 34 V38 Q50 24 14 38Z" '+hs+'/>';
  if(o.hair==="beanie")s+='<path d="M14 34 Q14 8 50 8 Q86 8 86 34Z" '+hs+'/><rect x="11" y="30" width="78" height="11" rx="5.5" fill="#fff"'+st+'/><circle cx="50" cy="5" r="7" fill="#fff"'+st+'/>';
  // joues
  if(o.blush)s+='<ellipse cx="25" cy="66" rx="7" ry="4.5" fill="#ff5d8f" opacity=".55"/><ellipse cx="75" cy="66" rx="7" ry="4.5" fill="#ff5d8f" opacity=".55"/>';
  // yeux
  const e=o.eyes||"open", dx=o.look||0;
  if(e==="open"||e==="wide"){
    const r=e==="wide"?10.5:9;
    [36,64].forEach(x=>{s+='<circle cx="'+x+'" cy="54" r="'+r+'" fill="#fff"/><circle cx="'+(x+dx)+'" cy="55" r="4.6" fill="'+ink+'"/><circle cx="'+(x+dx+1.6)+'" cy="53" r="1.5" fill="#fff"/>';});
  }else if(e==="dot"){
    [37,63].forEach(x=>{s+='<circle cx="'+(x+dx)+'" cy="53" r="4.4" fill="'+ink+'"/>';});
  }else if(e==="happy"){
    s+='<path d="M28 56 Q36 45 44 56 M56 56 Q64 45 72 56" fill="none" stroke="'+ink+'" stroke-width="4" stroke-linecap="round"/>';
  }else if(e==="heart"){
    [36,64].forEach(x=>{s+='<path d="M'+x+' 61 c-13-9-8-18 0-11 c8-7 13 2 0 11z" fill="#ff3d6e"/>';});
  }else if(e==="wink"){
    s+='<circle cx="36" cy="54" r="9" fill="#fff"/><circle cx="37" cy="55" r="4.6" fill="'+ink+'"/><path d="M56 55 Q64 49 72 55" fill="none" stroke="'+ink+'" stroke-width="4" stroke-linecap="round"/>';
  }
  if(o.brows)s+='<path d="M'+(o.brows==="worry"?"28 42 L44 38 M56 38 L72 42":"28 40 L44 41 M56 41 L72 40")+'" stroke="'+ink+'" stroke-width="3.2" stroke-linecap="round"/>';
  if(o.lashes)s+='<path d="M27 47 l-4-4 M73 47 l4-4" stroke="'+ink+'" stroke-width="2.6" stroke-linecap="round"/>';
  if(o.nose)s+='<path d="M51 55 q-5 9 0 10 q3 .4 4.5-1.6" fill="none" stroke="'+ink+'" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>';
  // bouche
  const m=o.mouth||"smile";
  if(m==="smile")s+='<path d="M41 70 Q50 79 59 70" fill="none" stroke="'+ink+'" stroke-width="3.6" stroke-linecap="round"/>';
  if(m==="shy")s+='<path d="M45 72 Q50 75 55 72" fill="none" stroke="'+ink+'" stroke-width="3.4" stroke-linecap="round"/>';
  if(m==="grin")s+='<path d="M38 68 Q50 86 62 68Z" fill="'+ink+'"/><path d="M44 76 Q50 81 56 76 Q50 73 44 76Z" fill="#ff5d8f"/>';
  if(m==="o")s+='<ellipse cx="50" cy="73" rx="4.5" ry="5.5" fill="'+ink+'"/>';
  if(m==="smirk")s+='<path d="M42 72 Q52 76 60 68" fill="none" stroke="'+ink+'" stroke-width="3.6" stroke-linecap="round"/>';
  // accessoires
  if(o.acc==="glasses")s+='<g fill="none" stroke="'+ink+'" stroke-width="3"><circle cx="36" cy="54" r="12.5"/><circle cx="64" cy="54" r="12.5"/><path d="M48.5 53 h3"/></g>';
  if(o.acc==="earring")s+='<circle cx="88" cy="68" r="4" fill="#ffd166" stroke="'+ink+'" stroke-width="1.5"/>';
  if(o.acc==="freckles")s+='<g fill="'+ink+'" opacity=".5"><circle cx="24" cy="62" r="1.3"/><circle cx="29" cy="65" r="1.3"/><circle cx="71" cy="65" r="1.3"/><circle cx="76" cy="62" r="1.3"/></g>';
  if(o.acc==="stache")s+='<path d="M38 68 Q44 62 50 67 Q56 62 62 68 Q56 71 50 68 Q44 71 38 68Z" fill="'+hairC+'"/>';
  if(o.acc==="bow")s+='<path d="M50 14 L36 6 V22Z M50 14 L64 6 V22Z" fill="#ff5d8f"'+st+'/><circle cx="50" cy="14" r="4" fill="#ff5d8f"'+st+'/>';
  if(o.sweat)s+='<path d="M90 30 q7 11 0 14 q-7-3 0-14z" fill="#7be0ff"/>';
  if(o.bust)s+='</g>';
  return s+'</svg>';
}

];
const MAP="wwwwwww|w..h..w|w.ww..w|wp...dw|wwww..w|w.....w|wwwwwww";

const THEMES=[
  {k:"a",cls:"ta",name:"A · Pop Portraits",pitch:"Portraits polaroïd, scotch et écriture à la main. L'humain passe par la coiffure, l'accessoire et la petite phrase de chaque personnage.",

const HAPPY={eyes:"happy",mouth:"grin",blush:1,brows:null,sweat:0};
const SAD={eyes:"open",mouth:"shy",brows:"worry",sweat:1,blush:0,look:-2};

function build(T){
  const C=CAST[T.k], me=C[0].o, date=C[1].o;
  const face=(o,x)=>chr({...o,...(x||{})});
  const head=o=>chr({...o,limbs:null,bust:null});
  const board='<div class="boardWrap"><div class="board">'+MAP.replace(/\|/g,"").split("").map(ch=>
      ch==="p"?'<i class="cp">'+head(me)+'</i>':ch==="d"?'<i class="cd">'+head(date)+'</i>':ch==="."?'<i></i>':'<i class="'+ch+'"></i>').join("")+'</div><span class="grav">↓</span></div>';
  const game=over=>'<div class="scr game"><div class="gfx"><span class="spark" style="left:16px;top:118px;--s:17px">✦</span><span class="spark" style="right:20px;top:392px;--s:13px;--d:.6s">✦</span><span class="spark" style="right:34px;top:96px;--s:11px;--d:1.1s">✦</span></div>'+
      '<div class="hd"><span class="round">II</span><span class="who">Léa<small>chapitre 3 · niveau 7</small></span><span class="moves"><span class="mv"><b>2</b> / 3</span><span class="pips"><em>coups</em><i class="on"></i><i class="on"></i><i></i></span></span></div>'+
      '<div class="gMid">'+board+'</div>'+
      '<div class="gFoot"><div class="react"><span class="mini">'+face(date)+'</span><p>'+T.react+'</p></div>'+
      '<div class="thumb"><span class="reset">↺ reset</span><span class="arc"><b>⟲</b><span class="lbl">glisse pour tourner</span><i class="knob"></i><b>⟳</b></span></div></div>'+
      (over||"")+'</div>';
  const S=[];

  const fx='<div class="fx">'+[[8,13,7,0],[24,18,9,-3],[41,11,8,-5.5],[58,16,10,-1.5],[73,12,7.5,-6.5],[88,19,9.5,-4],[15,10,11,-8],[66,14,8.5,-9]].map((v,i)=>
      '<i style="--x:'+v[0]+'%;--s:'+v[1]+'px;--t:'+v[2]+'s;--d:'+v[3]+'s;--dx:'+(i%2?-26:22)+'px">♥</i>').join("")+'</div>';
  const sparks='<span class="spark" style="left:-6px;top:8px;--s:15px;--d:0s">✦</span><span class="spark" style="right:-4px;bottom:34px;--s:11px;--d:.7s">✦</span>';
  S.push(["Menu",'<div class="scr menu">'+fx+
    '<div class="mTop"><span class="chip">★ 49</span><span class="chip">⚙</span></div>'+
    '<div class="logoBig"><span>date</span><span>gravity</span></div><div class="tagline">'+T.tag+'</div>'+
    '<div class="pair"><div class="frame f1">'+sparks+'<div class="pic">'+face(me)+'<span class="holo"></span></div><div class="cap">'+T.me+'<i>toucher pour changer</i></div></div><span class="amp">♥</span>'+
    '<div class="frame f2">'+T.badge+'<div class="pic">'+face(date)+'<span class="holo"></span></div><div class="cap">'+T.date+'<i>toucher pour changer</i></div></div></div>'+
    (T.msg?'<div class="msg">'+T.msg+'</div>':'')+
    '<div class="stack"><div class="btn play">Jouer<small>reprendre · chapitre 3, niveau 7</small></div>'+
    '<div class="two"><div class="btn ghost sm">Chapitres</div><div class="btn ghost sm">Options</div></div></div></div>']);

  S.push(["Chapitres",'<div class="scr"><div class="hd"><span class="round">←</span><span class="ttl">Chapitres</span><span class="chip">★ 49</span></div><div class="list">'+
    CHAPTERS.map((c,i)=>{const st=c[3]>=c[4]?"done":c[3]>0?"cur":"lock";
      return '<div class="row card '+st+'"><div class="av">'+face(C[T.cast[i%4]].o)+'</div><div class="tx"><b>'+c[1]+'</b><span>chapitre '+c[0]+' · '+c[2]+'</span><em class="bar"><i style="width:'+(c[3]/c[4]*100)+'%"></i></em></div>'+
        '<div class="st">'+(st==="lock"?"🔒":c[3]+"/"+c[4]+(st==="done"?" ✓":""))+'</div></div>';}).join("")+
    '</div></div>']);

  S.push(["Niveaux du chapitre",'<div class="scr"><div class="hd"><span class="round">←</span><span class="who">Boutons du cœur<small>chapitre 3 · 6 / 14 · 15 ★</small></span><span class="chip">43 %</span></div><div class="grid">'+
    Array.from({length:14},(_,i)=>{const st=i<6?"done":i===6?"cur":"lock", boss=i===13?" boss":"";
      const ic=st==="done"?head({...date,...HAPPY}):st==="cur"?head(me):(boss?"👑":"🔒");
      return '<div class="tile '+st+boss+'">'+(i+1)+'<div class="ic">'+ic+'</div><span class="stars">'+(st==="done"?"★★★".slice(0,i%3===1?2:3):"")+'</span></div>';}).join("")+
    '</div><div class="pager"><span class="round">◀</span><span class="muted">3 / 8 · suite à 70 %</span><span class="round">▶</span></div></div>']);

  S.push(["Profil (avant le niveau)",'<div class="scr"><div class="hd"><span class="round">←</span><span class="chip">chapitre 3 · niveau 7</span><span class="chip">♥ 12</span></div>'+
    '<div class="profile"><div class="pic">'+face(date)+'</div><div class="name">Léa, 27</div><div class="bio">'+T.bio+'</div><div class="tags"><span>3 coups</span><span>bouton</span></div></div>'+
    (T.k==="c"?'<div class="bubble">coucou… bien dormi ? 🙈</div>':'')+
    '<div class="btn cta">'+T.go+'</div></div>']);

  S.push(["Jeu",game()]);

  S.push(["Victoire",'<div class="scr"><div class="win"><div class="duo"><span>'+face(me,HAPPY)+'</span><span>'+face(date,{...HAPPY,eyes:T.k==="c"?"heart":"happy"})+'</span></div>'+
    '<h3>'+T.win+'</h3><div>'+T.winSub+'</div><div class="hearts">♥♥♥</div><div>3 coups · objectif 3</div>'+
    '<div class="btn">'+T.next+'</div><div class="btn ghost sm">Rejouer</div></div></div>']);

  S.push(["Défaite",game('<div class="overlay mid"><div class="modal"><div class="sad">'+face(date,SAD)+'</div><h3>'+T.lose+'</h3><p>'+T.loseTxt+'</p>'+
    '<div class="btn" style="margin-top:6px">Réessayer</div><div class="btn ghost sm">💡 Voir la solution<span class="adtag">PUB</span></div></div></div>')]);

  S.push(["Pause",game('<div class="overlay"><div class="modal"><h3>Pause</h3><div class="btn">Reprendre</div>'+
    '<div class="two"><div class="btn ghost sm">Recommencer</div><div class="btn ghost sm">Chapitres</div></div>'+
    '<div class="sl"><span>Musique</span><em class="bar"><i style="width:35%"></i></em></div><div class="sl"><span>Sons</span><em class="bar"><i style="width:70%"></i></em></div>'+
    '<div class="two"><div class="btn ghost sm">💡 Solution<span class="adtag">PUB</span></div><div class="btn ghost sm">Menu</div></div></div></div>')]);

  S.push(["Indice (après la pub)",game('<div class="overlay mid"><div class="modal"><div class="sad">'+face(C[T.cast[1]].o,{eyes:"wink",mouth:"smirk"})+'</div><h3>'+T.hint+'</h3><p>'+T.hintTxt+'</p>'+
    '<div class="seq"><b class="r">⟳</b><b>⟲</b><b class="r">⟳</b></div><p>3 coups : droite, gauche, droite.</p><div class="btn" style="margin-top:6px">J\'ai compris</div></div></div>')]);

  return '<section class="da '+T.cls+'" id="'+T.k+'"><h2>'+T.name+'</h2><p>'+T.pitch+'</p><div class="phones">'+
    S.map((s,i)=>'<div class="phoneWrap"><div class="phone">'+s[1]+'</div><small>'+(i+1)+' · '+s[0]+'</small></div>').join("")+'</div></section>';
}
document.getElementById("root").innerHTML=THEMES.map(build).join("");
</script>
