<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Date Gravity – Rappel du swipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800;900&display=swap" rel="stylesheet">
<style>
/* Maquette : cinq façons de rappeler le geste « glisser pour tourner » quand le joueur ne fait rien.
   Chaque carte reproduit le bas de l'écran de jeu : un plateau simplifié et la zone juste dessous. */
:root{--navy:#0d1230;--navy2:#131a45;--navy3:#172052;--ink:#eaf0ff;--muted:#8fa0d8;--line:#2b3a8c;--c1:#f6ff3d;--c2:#19e3ff}
*{box-sizing:border-box}
body{margin:0;background:#07091a;color:var(--ink);font:500 15px/1.45 Rubik,Arial,sans-serif}
main{max-width:1180px;margin:0 auto;padding:28px 18px 60px}
h1{margin:0;font:900 32px/1 Rubik,Arial,sans-serif;text-transform:uppercase;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{max-width:760px;margin:10px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:22px}
.card{padding:14px;border-radius:22px;background:var(--navy2);box-shadow:inset 0 0 0 2px var(--line)}
.card h2{margin:0;font:900 17px/1.1 Rubik,Arial,sans-serif;text-transform:uppercase}
.card h2 span{color:var(--c2)}
.card p{margin:6px 0 0;font-size:13px;color:var(--muted);min-height:56px}
.phone{position:relative;height:330px;margin-top:10px;border-radius:18px;background:var(--navy);overflow:hidden}
.board{position:absolute;left:50%;top:22px;width:190px;height:190px;margin-left:-95px}
.board svg{display:block;width:100%;height:100%;overflow:visible}
.zone{position:absolute;left:0;right:0;top:226px;height:90px}
.hand{position:absolute;width:54px;height:54px;fill:#fff;stroke:var(--navy);stroke-width:1.1;stroke-linejoin:round;paint-order:stroke;filter:drop-shadow(0 0 8px var(--c2));overflow:visible}
.cap{position:absolute;left:0;right:0;text-align:center;font:800 11px/1 Rubik,Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* A · le doigt sur le plateau : il le fait pencher, lâche, et le plateau termine son quart de tour */
.a .board{animation:aBoard 3.6s cubic-bezier(.4,0,.2,1) infinite}
.a .hand{left:50%;top:96px;margin-left:-22px;animation:aHand 3.6s ease-in-out infinite}
@keyframes aBoard{0%,12%{transform:rotate(0)}40%{transform:rotate(17deg)}52%,78%{transform:rotate(90deg)}79%,100%{transform:rotate(0)}}
@keyframes aHand{0%,6%{opacity:0;transform:translateX(-10px) scale(1.2)}13%{opacity:1;transform:translateX(-10px) scale(1)}40%{opacity:1;transform:translateX(58px) scale(1)}47%,100%{opacity:0;transform:translateX(70px) scale(1.2)}}

/* B · le doigt sous le plateau, avec une traînée lumineuse qui montre le trajet */
.b .track{position:absolute;left:50%;top:44px;width:150px;height:6px;margin-left:-75px;border-radius:99px;background:var(--navy3)}
.b .trail{position:absolute;left:50%;top:44px;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 0 12px var(--c2);animation:bTrail 3.4s ease-in-out infinite}
.b .hand{left:50%;top:38px;margin-left:-22px;animation:bHand 3.4s ease-in-out infinite}
@keyframes bHand{0%{opacity:0;transform:translateX(0)}8%{opacity:1;transform:translateX(0)}36%{opacity:1;transform:translateX(62px)}44%,50%{opacity:0;transform:translateX(62px)}51%{opacity:0;transform:translateX(0)}58%{opacity:1;transform:translateX(0)}86%{opacity:1;transform:translateX(-62px)}94%,100%{opacity:0;transform:translateX(-62px)}}
@keyframes bTrail{0%,8%{width:0;margin-left:0;opacity:1}36%{width:62px;margin-left:0;opacity:1}44%,58%{width:0;margin-left:0;opacity:0}59%{width:0;margin-left:0;opacity:1}86%{width:62px;margin-left:-62px;opacity:1}94%,100%{width:62px;margin-left:-62px;opacity:0}}

/* C · pas de main : un point de contact avec ses ondes, comme dans les guides de gestes */
.c .dot{position:absolute;left:50%;top:30px;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 6px rgba(255,255,255,.22),0 0 18px var(--c2);animation:cDot 3.2s ease-in-out infinite}
.c .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid #fff;animation:cRing 3.2s ease-out infinite}
@keyframes cDot{0%{opacity:0;transform:translateX(0) scale(1.5)}8%{opacity:1;transform:translateX(0) scale(1)}36%{opacity:1;transform:translateX(64px) scale(1)}46%,50%{opacity:0;transform:translateX(64px) scale(1.5)}51%{opacity:0;transform:translateX(0) scale(1.5)}58%{opacity:1;transform:translateX(0) scale(1)}86%{opacity:1;transform:translateX(-64px) scale(1)}96%,100%{opacity:0;transform:translateX(-64px) scale(1.5)}}
@keyframes cRing{0%,7%{transform:scale(1);opacity:.9}20%{transform:scale(2.1);opacity:0}50%,57%{transform:scale(1);opacity:.9}70%,100%{transform:scale(2.1);opacity:0}}

/* D · la main au centre et des chevrons qui s'allument l'un après l'autre de chaque côté */
.d .hand{left:50%;top:22px;margin-left:-27px;animation:dHand 2.8s ease-in-out infinite}
.d .chev{position:absolute;top:30px;display:flex;gap:2px;font:900 30px/1 Rubik,Arial,sans-serif;color:var(--line)}
.d .chev.r{left:calc(50% + 34px)}.d .chev.l{right:calc(50% + 34px);flex-direction:row-reverse}
.d .chev i{font-style:normal;animation:dChev 2.8s linear infinite}
.d .chev.r i:nth-child(1){animation-delay:0s}.d .chev.r i:nth-child(2){animation-delay:.12s}.d .chev.r i:nth-child(3){animation-delay:.24s}
.d .chev.l i:nth-child(1){animation-delay:1.4s}.d .chev.l i:nth-child(2){animation-delay:1.52s}.d .chev.l i:nth-child(3){animation-delay:1.64s}
@keyframes dChev{0%,100%{color:var(--line)}6%,16%{color:var(--c2);text-shadow:0 0 10px var(--c2)}30%{color:var(--line);text-shadow:none}}
@keyframes dHand{0%,100%{transform:translateX(0)}18%{transform:translateX(16px)}36%,50%{transform:translateX(0)}68%{transform:translateX(-16px)}86%{transform:translateX(0)}}

/* E · aucun doigt : c'est le plateau lui-même qui se dandine, avec un mot dessous */
.e .board{animation:eBoard 2.6s ease-in-out infinite}
@keyframes eBoard{0%,100%{transform:rotate(0)}20%{transform:rotate(9deg)}40%{transform:rotate(0)}60%{transform:rotate(-9deg)}80%{transform:rotate(0)}}
.e .cap{top:34px;font-size:13px;color:var(--ink)}
.e .cap b{margin:0 10px;font-size:20px;color:var(--c2);vertical-align:-2px}
.e .cap b:first-child{color:var(--c1)}

/* ===== deuxième série ===== */
h3{margin:34px 0 0;font:900 18px/1.1 Rubik,Arial,sans-serif;text-transform:uppercase;letter-spacing:.04em}
/* F · le volant : le doigt décrit un arc sous le plateau, qui tourne avec lui comme une roue */
.f .board{animation:fBoard 3.4s cubic-bezier(.4,0,.2,1) infinite}
.f .arcTrack{position:absolute;left:50%;top:-172px;width:250px;height:250px;margin-left:-125px;border-radius:50%;border:3px dashed var(--line);clip-path:inset(72% 0 0 0)}
.f .orbit{position:absolute;left:50%;top:-172px;width:250px;height:250px;margin-left:-125px;animation:fOrbit 3.4s cubic-bezier(.4,0,.2,1) infinite}
.f .orbit .hand{left:50%;bottom:-30px;margin-left:-22px;animation:fFade 3.4s linear infinite}
@keyframes fBoard{0%,12%{transform:rotate(0)}46%{transform:rotate(-34deg)}58%,80%{transform:rotate(-90deg)}81%,100%{transform:rotate(0)}}
@keyframes fOrbit{0%,12%{transform:rotate(22deg)}46%,100%{transform:rotate(-22deg)}}
@keyframes fFade{0%,5%{opacity:0}12%,46%{opacity:1}54%,100%{opacity:0}}

/* G · le fantôme : un contour du plateau montre où il arrivera, avec une flèche courbe */
.g .ghost{position:absolute;left:50%;top:22px;width:190px;height:190px;margin-left:-95px;border-radius:20px;border:3px dashed var(--c2);opacity:0;animation:gGhost 3s ease-in-out infinite}
.g .curve{position:absolute;left:50%;top:6px;width:222px;height:222px;margin-left:-111px;overflow:visible;animation:gCurve 3s ease-in-out infinite}
@keyframes gGhost{0%,10%{opacity:0;transform:rotate(0)}30%{opacity:.9;transform:rotate(0)}70%{opacity:.9;transform:rotate(90deg)}90%,100%{opacity:0;transform:rotate(90deg)}}
@keyframes gCurve{0%,25%{opacity:0}40%,75%{opacity:1}90%,100%{opacity:0}}
.g .cap{top:34px}

/* H · la personne te le dit : sa bulle montre le geste, comme un message */
.h .mini{position:absolute;left:14px;top:20px;width:44px;height:40px;border-radius:13px;background:#2fd0e0;box-shadow:inset 0 0 0 3px #06324a}
.h .mini::before,.h .mini::after{content:"";position:absolute;top:16px;width:6px;height:6px;border-radius:50%;background:#06324a}
.h .mini::before{left:11px}.h .mini::after{right:11px}
.h .bubble{position:absolute;left:68px;top:14px;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:16px 16px 16px 4px;background:var(--navy3);box-shadow:inset 0 0 0 2px var(--c2),0 0 14px rgba(25,227,255,.35);font:800 13px/1 Rubik,Arial,sans-serif}
.h .bubble .hand{position:static;width:26px;height:26px;filter:none;animation:hWag 1.6s ease-in-out infinite}
.h .bubble b{font-size:18px;color:var(--c2);animation:hArrow 1.6s ease-in-out infinite}
@keyframes hWag{0%,100%{transform:translateX(-5px)}50%{transform:translateX(7px)}}
@keyframes hArrow{0%,100%{opacity:.3;transform:translateX(0)}50%{opacity:1;transform:translateX(5px)}}

/* I · les poignées : deux prises lumineuses sur les côtés du plateau, qui s'allument tour à tour */
.i .grip{position:absolute;top:92px;width:12px;height:50px;border-radius:99px;background:var(--line);animation:iGrip 2.8s ease-in-out infinite}
.i .grip.l{left:calc(50% - 121px)}.i .grip.r{left:calc(50% + 109px);animation-delay:1.4s}
.i .board{animation:iBoard 2.8s ease-in-out infinite}
@keyframes iGrip{0%,100%{background:var(--line);box-shadow:none;transform:translateY(0)}14%{background:var(--c2);box-shadow:0 0 16px var(--c2);transform:translateY(14px)}30%{background:var(--line);box-shadow:none;transform:translateY(0)}}
@keyframes iBoard{0%,100%{transform:rotate(0)}14%{transform:rotate(-7deg)}30%,50%{transform:rotate(0)}64%{transform:rotate(7deg)}80%{transform:rotate(0)}}

/* J · le reflet : « glisse pour tourner » parcouru par un éclat, comme un écran à déverrouiller */
.j .slide{position:absolute;left:50%;top:26px;width:200px;margin-left:-100px;padding:12px 0;border-radius:99px;background:var(--navy3);box-shadow:inset 0 0 0 2px var(--line);text-align:center;font:900 13px/1 Rubik,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:transparent;background-image:linear-gradient(100deg,var(--muted) 35%,#fff 50%,var(--muted) 65%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;animation:jShine 2.2s linear infinite}
.j .slideBg{position:absolute;left:50%;top:26px;width:200px;height:37px;margin-left:-100px;border-radius:99px;background:var(--navy3);box-shadow:inset 0 0 0 2px var(--line)}
@keyframes jShine{0%{background-position:120% 0}100%{background-position:-60% 0}}

/* K · la trace : le doigt disparaît, il ne reste que sa trace lumineuse sur le plateau, façon comète */
.k .streak{position:absolute;left:50%;top:104px;height:26px;border-radius:99px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95));box-shadow:0 0 18px var(--c2);animation:kStreak 3.2s cubic-bezier(.3,0,.2,1) infinite}
.k .board{animation:kBoard 3.2s cubic-bezier(.4,0,.2,1) infinite}
@keyframes kStreak{0%,8%{width:26px;margin-left:-50px;opacity:0}14%{width:26px;margin-left:-50px;opacity:1}38%{width:120px;margin-left:-50px;opacity:1}50%,100%{width:26px;margin-left:44px;opacity:0}}
@keyframes kBoard{0%,36%{transform:rotate(0)}54%,80%{transform:rotate(90deg)}81%,100%{transform:rotate(0)}}
</style>
</head>
<body>
<main>
  <h1>Rappel du swipe</h1>
  <p class="lead">Cinq propositions pour montrer le geste quand le joueur ne fait rien. Dans le jeu, le rappel n'apparaît qu'après quelques secondes d'inactivité et disparaît dès qu'on touche l'écran.</p>
  <div class="grid" id="grid"></div>
  <h3>Deuxième série</h3>
  <div class="grid" id="grid2"></div>
</main>

<script>
const BOARD='<div class="board"><svg viewBox="0 0 190 190"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6ff3d"/><stop offset="1" stop-color="#19e3ff"/></linearGradient></defs>'
  +'<rect x="4" y="4" width="182" height="182" rx="20" fill="#131a45"/>'
  +'<g fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="14" width="162" height="162" rx="14"/><rect x="50" y="62" width="62" height="20" rx="10"/><rect x="118" y="112" width="20" height="46" rx="10"/></g>'
  +'<rect x="30" y="136" width="24" height="22" rx="7" fill="#ff9a2e" stroke="#3a1205" stroke-width="2"/><rect x="144" y="34" width="24" height="22" rx="7" fill="#2fd0e0" stroke="#06324a" stroke-width="2"/></svg></div>';
const HAND='<svg class="hand" viewBox="0 0 24 24"><path d="M18.84 15.87l-4.54-2.26c-.17-.07-.35-.11-.54-.11H13v-6c0-.83-.67-1.5-1.5-1.5S10 6.67 10 7.5v10.74l-3.43-.72c-.08-.01-.15-.03-.24-.03-.31 0-.59.13-.79.33l-.79.8 4.94 4.94c.27.27.65.44 1.06.44h6.79c.75 0 1.33-.55 1.44-1.28l.75-5.27c.01-.07.02-.14.02-.2 0-.62-.38-1.16-.91-1.38z"/></svg>';
const LIST=[
  ["a","A","Le doigt sur le plateau","Le doigt se pose sur le plateau et le fait pencher ; il lâche et le plateau finit son quart de tour. On voit le geste et son effet.",BOARD+HAND],
  ["b","B","Doigt et traînée","Le doigt glisse sous le plateau en laissant une traînée lumineuse, à droite puis à gauche.",BOARD+'<div class="zone"><div class="track"></div><div class="trail"></div>'+HAND+'</div>'],
  ["c","C","Point de contact","Pas de main : un point blanc avec ses ondes, comme dans les guides de gestes des téléphones.",BOARD+'<div class="zone"><div class="dot"></div></div>'],
  ["d","D","Main et chevrons","La main reste au centre et des chevrons s'allument l'un après l'autre de chaque côté.",BOARD+'<div class="zone"><div class="chev l"><i>‹</i><i>‹</i><i>‹</i></div>'+HAND+'<div class="chev r"><i>›</i><i>›</i><i>›</i></div></div>'],
  ["e","E","Le plateau se dandine","Aucun doigt : le plateau penche tout seul d'un côté puis de l'autre, avec un mot dessous.",BOARD+'<div class="zone"><div class="cap"><b>⟲</b>glisse<b>⟳</b></div></div>']
];
const CURVE='<svg class="curve" viewBox="0 0 222 222"><path d="M150 8A110 110 0 0 1 214 72" fill="none" stroke="#19e3ff" stroke-width="5" stroke-linecap="round"/><path d="M214 72l-16 -4M214 72l2 -17" fill="none" stroke="#19e3ff" stroke-width="5" stroke-linecap="round"/></svg>';
const LIST2=[
  ["f","F","Le volant","Le doigt décrit un arc sous le plateau, qui tourne avec lui comme une roue. Le geste ressemble vraiment à « tourner ».",BOARD+'<div class="zone"><div class="arcTrack"></div><div class="orbit">'+HAND+'</div></div>'],
  ["g","G","Le fantôme du plateau","Aucun doigt : un contour en pointillés montre le plateau en train de basculer, avec une flèche courbe.",BOARD+'<div class="ghost"></div>'+CURVE+'<div class="zone"><div class="cap">glisse pour tourner</div></div>'],
  ["h","H","La personne te le dit","Le rappel passe par la bulle de la personne à rejoindre, comme un message : aucun élément en plus à l'écran.",BOARD+'<div class="zone"><div class="mini"></div><div class="bubble">'+HAND+'Glisse-moi par là<b>→</b></div></div>'],
  ["i","I","Les poignées","Deux prises sur les côtés du plateau s'allument tour à tour et le font pencher : on a envie de les tirer.",BOARD+'<div class="grip l"></div><div class="grip r"></div>'],
  ["j","J","Le reflet","Le texte « glisse pour tourner » est parcouru par un éclat, comme un écran à déverrouiller.",BOARD+'<div class="zone"><div class="slideBg"></div><div class="slide">glisse pour tourner</div></div>'],
  ["k","K","La trace","Pas de main : seulement la trace lumineuse d'un doigt qui traverse le plateau, puis le plateau tourne.",BOARD+'<div class="streak"></div>']
];
const cards=list=>list.map(([cls,letter,title,text,html])=>
  '<section class="card '+cls+'"><h2><span>'+letter+' ·</span> '+title+'</h2><p>'+text+'</p><div class="phone">'+html+'</div></section>').join("");
document.getElementById("grid").innerHTML=cards(LIST);
document.getElementById("grid2").innerHTML=cards(LIST2);
</script>
</body>
</html>
